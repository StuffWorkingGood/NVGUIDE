<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mojave Wiki // RobCo Termlink</title>
<style>
  :root{
    --amber:#ffb642; --amber-dim:#a86d1a; --amber-bright:#ffd789;
    --rust:#9c4a28; --sand:#d4b483; --text:#d4a04a;
    --bg:#1a1208; --bg-dark:#120c04; --panel:#1f160a; --panel-light:#2a1e0c; --line:#5a3d12;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:radial-gradient(ellipse at 50% 0%, #241808 0%, var(--bg) 50%, var(--bg-dark) 100%);
    background-attachment:fixed;
    font-family:'Courier New',Courier,monospace;
    color:var(--amber);
    min-height:100vh;
    position:relative;
    -webkit-font-smoothing:none;
  }
  /* CRT overlays */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.12) 3px,rgba(0,0,0,0.12) 4px);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:98;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.65) 100%);
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 60px;position:relative;z-index:1;}

  header{
    border-bottom:2px solid var(--amber);
    background:linear-gradient(180deg,var(--panel),var(--bg));
    padding:18px 16px 14px;position:sticky;top:0;z-index:50;
    box-shadow:0 0 30px rgba(255,182,66,0.15);
  }
  .hdr-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;max-width:820px;margin:0 auto;}
  .term-label{font-size:9px;letter-spacing:5px;color:var(--amber-dim);}
  .term-title{font-size:24px;letter-spacing:5px;font-weight:bold;color:var(--amber-bright);text-shadow:0 0 18px var(--amber);}
  .hdr-status{font-size:9px;color:var(--amber-dim);letter-spacing:2px;text-align:right;line-height:1.6;}

  nav{display:flex;gap:4px;margin:14px auto 0;flex-wrap:wrap;max-width:820px;}
  .tab{
    background:transparent;color:var(--amber-dim);
    border:1px solid var(--line);padding:6px 13px;font-size:10px;letter-spacing:2px;
    cursor:pointer;font-family:inherit;font-weight:bold;display:flex;align-items:center;gap:6px;
    transition:all .12s;
  }
  .tab:hover{border-color:var(--amber);color:var(--amber);}
  .tab.active{background:var(--amber);color:var(--bg-dark);border-color:var(--amber);}

  .panel{border:1px solid var(--amber);background:var(--panel);margin-top:18px;box-shadow:0 0 24px rgba(255,182,66,0.08);}
  .panel-head{border-bottom:1px solid var(--line);padding:14px 16px;background:linear-gradient(180deg,var(--panel-light),var(--panel));}
  .dossier-tag{font-size:9px;letter-spacing:4px;color:var(--amber-dim);margin-bottom:5px;}
  .entry-name{font-size:19px;font-weight:bold;letter-spacing:3px;color:var(--amber-bright);text-shadow:0 0 14px var(--amber);}
  .chips{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:10px;color:var(--text);}
  .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .tag{border:1px solid var(--line);padding:2px 7px;font-size:8px;letter-spacing:1px;color:var(--amber-dim);}
  .panel-body{padding:16px;}

  .sec-title{font-size:10px;letter-spacing:3px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:5px;margin:18px 0 10px;font-weight:bold;}
  .sec-title:first-child{margin-top:0;}
  p.para{font-size:12.5px;color:var(--text);line-height:1.85;}

  .dlg-topic{font-size:12px;color:var(--amber-bright);font-weight:bold;letter-spacing:1px;margin-bottom:6px;}
  .dlg-opt{border-left:2px solid var(--line);padding-left:12px;margin:0 0 8px 8px;}
  .dlg-line{font-size:11px;color:var(--amber);font-style:italic;margin-bottom:2px;}
  .dlg-res{font-size:11px;color:var(--text);line-height:1.6;}

  .step{display:flex;gap:10px;margin-bottom:10px;}
  .step-num{min-width:22px;height:22px;border:1px solid var(--amber);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0;}
  .step-title{font-size:12px;color:var(--amber-bright);font-weight:bold;}
  .step-detail{font-size:11px;color:var(--text);line-height:1.6;margin-top:2px;}

  .choice{border-left:2px solid var(--rust);padding-left:12px;margin-bottom:12px;}
  .choice-q{font-size:12px;color:var(--amber-bright);font-weight:bold;margin-bottom:3px;}
  .choice-o{font-size:11px;color:var(--text);line-height:1.7;}

  .fact{border-left:2px solid var(--amber-dim);padding-left:12px;margin-bottom:8px;font-size:11px;color:var(--text);line-height:1.7;}
  .fact b{color:var(--amber);}

  .list-item{font-size:11.5px;color:var(--text);margin-bottom:7px;line-height:1.6;}
  .list-item b{color:var(--amber-bright);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .card{background:#040c04;background:rgba(0,0,0,0.25);border:1px solid var(--line);padding:11px 13px;text-align:left;cursor:pointer;font-family:inherit;color:var(--amber);transition:all .12s;}
  .card:hover{border-color:var(--amber);transform:translateX(2px);}
  .card-name{font-weight:bold;font-size:12px;letter-spacing:1px;}
  .card-sub{font-size:9px;color:var(--amber-dim);margin-top:4px;}

  .back-btn{background:transparent;border:1px solid var(--line);color:var(--amber);padding:6px 12px;font-family:inherit;font-size:10px;letter-spacing:2px;cursor:pointer;margin-bottom:14px;}
  .back-btn:hover{border-color:var(--amber);}

  .intro{border:1px dashed var(--line);background:rgba(0,0,0,0.2);padding:18px;font-size:11px;color:var(--amber-dim);letter-spacing:1px;line-height:1.8;}

  /* Timeline */
  .tl-era{margin-bottom:8px;}
  .tl-era-head{background:var(--panel-light);border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .tl-era-title{font-size:13px;color:var(--amber-bright);font-weight:bold;letter-spacing:1px;}
  .tl-era-range{font-size:10px;color:var(--amber-dim);}
  .tl-events{padding:6px 0 6px 0;display:none;}
  .tl-era.open .tl-events{display:block;}
  .tl-event{display:flex;gap:14px;padding:8px 14px;border-bottom:1px solid rgba(90,61,18,0.3);}
  .tl-year{min-width:78px;font-size:11px;color:var(--amber);font-weight:bold;flex-shrink:0;}
  .tl-desc{font-size:11.5px;color:var(--text);line-height:1.7;}
  .tl-desc b{color:var(--amber-bright);}

  footer{text-align:center;padding:24px 16px;color:var(--line);font-size:9px;letter-spacing:4px;}
  .blink{animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
<header>
  <div class="hdr-top">
    <div>
      <div class="term-label">ROBCO INDUSTRIES (TM) TERMLINK</div>
      <div class="term-title">MOJAVE WIKI</div>
    </div>
    <div class="hdr-status">
      <div>&gt; ACCESS GRANTED</div>
      <div>&gt; COURIER VI <span class="blink">_</span></div>
    </div>
  </div>
  <nav id="nav"></nav>
</header>

<div class="wrap" id="content"></div>

<footer>— END OF LINE — GOOD LUCK OUT THERE, COURIER —</footer>

      funfacts:["Voiced by Matthew Perry (Chandler from Friends) — one of his final roles.","His catchphrases ('pally', 'baby', 'true to the game') were largely improvised by Perry.","He genuinely believes he outwitted Mr. House. He did not.","Maria is named after the pistol's engraving of Our Lady of Guadalupe."]
    },
    {
      name:"Mr. House", faction:"New Vegas (independent)", location:"Lucky 38 penthouse",
      status:"Neutral until you choose a side", race:"Human (in stasis)", tags:["Main Quest","Faction Leader","Final Boss"],
      summary:"Robert Edwin House — 261-year-old founder of RobCo, kept alive in a life-support pod beneath the Lucky 38. He foresaw the Great War, shielded Vegas from most of the bombs, and now rules the Strip through his securitron army and the three tamed Families.",
      backstory:"A prodigy businessman before the war, House used probability modeling to predict the nuclear apocalypse to within hours. He spent his fortune building defenses for Las Vegas, deploying a missile-defense grid that stopped 59 of 77 warheads aimed at the city. He sealed himself in a stasis pod in 2077 and slept through the worst, emerging to rebuild Vegas as a sovereign city-state. He needs the Platinum Chip — a data upgrade for his securitrons — to win the coming battle for Hoover Dam.",

        {topic:"Discovering his pod", options:[

      quests:[{name:"The House Always Wins",role:"Questline to install him as ruler"},{name:"Render Unto Caesar / Et Tumor, Brute?",role:"Opposed faction leader"}],

    {

      funfacts:["He recites scripture (notably his own annotated verses) before and after combat.","Caesar reportedly regretted burning him, calling it a mistake — Graham was that effective.","He keeps his bandages on at all times; the routine of re-wrapping grounds him.","One of the most acclaimed characters in the series, written by Joshua Sawyer."]
    },
    {
      name:"Craig Boone", faction:"Ex-NCR 1st Recon", location:"Novac (in the dinosaur at night)",
      status:"Recruitable", race:"Human", tags:["Companion","Sniper","Tragic"],
      summary:"A former NCR 1st Recon sniper haunted by his time at the Bitter Springs massacre and the loss of his wife Carla to Legion slavers. Quiet, grim, and the deadliest companion in the game.",

/* ============================================================
   RENDERING
   ============================================================ */
const MODES = [
  {key:"character", label:"CHARACTERS", icon:"☣"},
  {key:"quest",     label:"QUESTS",     icon:"✦"},
  {key:"location",  label:"LOCATIONS",  icon:"◈"},
  {key:"weapon",    label:"WEAPONS",    icon:"⚔"},
  {key:"secret",    label:"SECRETS",    icon:"★"},
  {key:"timeline",  label:"TIMELINE",   icon:"⏱"}
];

let state = {mode:"character", selected:null};

const nav = document.getElementById("nav");
const content = document.getElementById("content");

function esc(s){return (s==null?"":String(s));}

function renderNav(){
  nav.innerHTML = "";
  MODES.forEach(m=>{
    const b=document.createElement("button");
    b.className="tab"+(state.mode===m.key?" active":"");
    b.innerHTML=`<span>${m.icon}</span>${m.label}`;
    b.onclick=()=>{state.mode=m.key;state.selected=null;render();window.scrollTo(0,0);};
    nav.appendChild(b);
  });
}

function chip(label){return label?`<span>${label}</span>`:"";}

function renderList(){
  const items = DATA[state.mode] || [];
  const subKey = {character:"faction",quest:"status",location:"region",weapon:"class",secret:"rarity"}[state.mode];
  let html = `<div class="intro">Browse the ${state.mode} archive below. Tap any entry for the full dossier.<br><span style="color:var(--line)">${items.length} entries on file.</span></div>`;
  html += `<div class="grid" style="margin-top:14px">`;
  items.forEach((it,i)=>{
    html += `<button class="card" onclick="openEntry(${i})">
      <div class="card-name">${esc(it.name).toUpperCase()}</div>
      <div class="card-sub">${esc(it[subKey]||"")}</div>
    </button>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

function section(title, body){
  if(!body) return "";
  return `<div class="sec-title">&gt;&gt; ${title}</div>${body}`;
}

function renderEntry(it){
  const dangerC = (d)=>{d=(d||"").toLowerCase();return d.includes("extreme")?"#ff5a3a":d.includes("high")?"#ff8a3a":"var(--text)";};
  let chips = "";
  [["⚑",it.faction],["◈",it.location||it.region],["●",it.status],["☻",it.questgiver],
   ["⚔",it.class],["◉",it.ammo],["⊗",it.race],["★",it.rarity]].forEach(([ic,v])=>{
    if(v) chips += `<span>${ic} ${esc(v)}</span>`;
  });
  if(it.danger) chips += `<span style="color:${dangerC(it.danger)}">⚠ ${esc(it.danger)}</span>`;

  let tags = (it.tags||[]).map(t=>`<span class="tag">${esc(t).toUpperCase()}</span>`).join("");

  let body = "";
  if(it.summary) body += `<p class="para">${esc(it.summary)}</p>`;

  if(it.secretof) body += section("WHY IT'S A SECRET", `<div style="border-left:2px solid var(--amber-bright);padding:10px 12px;background:rgba(255,182,66,0.05)"><p class="para">${esc(it.secretof)}</p></div>`);
  if(it.backstory) body += section("BACKSTORY", `<p class="para">${esc(it.backstory)}</p>`);

  if(it.dialogue) body += section("DIALOGUE & CONVERSATIONS", it.dialogue.map(d=>{
    const opts = (d.options||[]).map(o=>`<div class="dlg-opt"><div class="dlg-line">"${esc(o.line)}"</div><div class="dlg-res">↳ ${esc(o.result)}</div></div>`).join("");
    return `<div style="margin-bottom:14px"><div class="dlg-topic">▸ ${esc(d.topic)}</div>${opts}</div>`;
  }).join(""));

  if(it.walkthrough) body += section("WALKTHROUGH", it.walkthrough.map((s,i)=>
    `<div class="step"><div class="step-num">${i+1}</div><div><div class="step-title">${esc(s.step)}</div><div class="step-detail">${esc(s.detail)}</div></div></div>`
  ).join(""));

  if(it.howtoget) body += section("HOW TO ACQUIRE", it.howtoget.map((s,i)=>
    `<div class="step"><div class="step-num">${i+1}</div><div><div class="step-title">${esc(s.step)}</div>${s.detail?`<div class="step-detail">${esc(s.detail)}</div>`:""}</div></div>`
  ).join(""));

  if(it.choices) body += section("KEY CHOICES & CONSEQUENCES", it.choices.map(c=>
    `<div class="choice"><div class="choice-q">⮞ ${esc(c.choice)}</div><div class="choice-o">${esc(c.outcomes)}</div></div>`
  ).join(""));

  if(it.skillchecks && it.skillchecks.length) body += section("SKILL CHECKS", it.skillchecks.map(s=>
    `<div style="display:flex;gap:10px;font-size:11px;margin-bottom:6px"><span style="color:var(--amber);font-weight:bold;min-width:110px">${esc(s.check)}</span><span style="color:var(--text);line-height:1.5">${esc(s.reward)}</span></div>`
  ).join(""));

  if(it.stats) body += section("STATS", `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">`+
    it.stats.map(s=>`<div style="border:1px solid var(--line);padding:8px 10px;background:var(--bg-dark)"><div style="font-size:9px;color:var(--amber-dim);letter-spacing:1px">${esc(s.stat).toUpperCase()}</div><div style="font-size:14px;color:var(--amber-bright);font-weight:bold">${esc(s.value)}</div></div>`).join("")
    +`</div>`);

  if(it.quirks) body += section("QUIRKS & SPECIAL EFFECTS", `<p class="para">${esc(it.quirks)}</p>`);
  if(it.combat) body += section("COMBAT", `<p class="para">${esc(it.combat)}</p>`);
  if(it.comparison) body += section("IS IT WORTH IT?", `<p class="para">${esc(it.comparison)}</p>`);
  if(it.mods) body += section("WEAPON MODS", `<p class="para">${esc(it.mods)}</p>`);
  if(it.rewards) body += section("REWARDS", `<p class="para">${esc(it.rewards)}</p>`);
  if(it.dangers) body += section("DANGERS", `<p class="para">${esc(it.dangers)}</p>`);

  if(it.notable) body += section("NOTABLE NPCS & FEATURES", it.notable.map(n=>
    `<div class="list-item"><b>◆ ${esc(n.name)}</b> — ${esc(n.detail)}</div>`).join(""));
  if(it.loot) body += section("LOOT & ITEMS", it.loot.map(l=>
    `<div class="list-item"><b>✦ ${esc(l.item)}</b> — ${esc(l.where)}</div>`).join(""));

  if(it.quests && it.quests.length) body += section("RELATED QUESTS", it.quests.map(q=>
    typeof q==="string"?`<div class="list-item">✦ ${esc(q)}</div>`:`<div class="list-item">✦ <b>${esc(q.name)}</b> — ${esc(q.role)}</div>`
  ).join(""));

  if(it.funfacts) body += section("FUN FACTS & TRIVIA", it.funfacts.map(f=>
    `<div class="fact"><b>◆</b> ${esc(f)}</div>`).join(""));

  content.innerHTML = `
    <button class="back-btn" onclick="backToList()">‹ BACK TO ${state.mode.toUpperCase()} LIST</button>
    <div class="panel">
      <div class="panel-head">
        <div class="dossier-tag">&gt; DOSSIER // ${esc(it.type||state.mode).toUpperCase()}</div>
        <div class="entry-name">${esc(it.name).toUpperCase()}</div>
        <div class="chips">${chips}</div>
        ${tags?`<div class="tags">${tags}</div>`:""}
      </div>
      <div class="panel-body">${body}</div>
    </div>`;
}

function renderTimeline(){
  let html = `<div class="intro">A condensed history of the Fallout world, from the Resource Wars to the Mojave and beyond. Tap an era to expand.<br><span style="color:var(--line)">Dates use the in-universe Fallout calendar.</span></div><div style="margin-top:16px">`;
  TIMELINE.forEach((era,ei)=>{
    const evs = era.events.map(e=>`<div class="tl-event"><div class="tl-year">${esc(e.year)}</div><div class="tl-desc">${e.desc}</div></div>`).join("");
    html += `<div class="tl-era${ei<=6?" open":""}" id="era-${ei}">
      <div class="tl-era-head" onclick="document.getElementById('era-${ei}').classList.toggle('open')">
        <span class="tl-era-title">${esc(era.era)}</span>
        <span class="tl-era-range">${esc(era.range)} ▾</span>
      </div>
      <div class="tl-events">${evs}</div>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

window.openEntry = function(i){ state.selected=i; renderEntry(DATA[state.mode][i]); window.scrollTo(0,0); };
window.backToList = function(){ state.selected=null; render(); window.scrollTo(0,0); };

function render(){
  renderNav();
  if(state.mode==="timeline"){ renderTimeline(); return; }
  if(state.selected!=null){ renderEntry(DATA[state.mode][state.selected]); return; }
  renderList();
}

render();
</script>
</body>
</html>
